<?xml version='1.0' encoding='UTF-8' standalone='no'?>
<svg height="30.600000000000001" version="1.2" width="22" xmlns="http://www.w3.org/2000/svg" xmlns:atv="http://webmi.atvise.com/2007/svgext" xmlns:xlink="http://www.w3.org/1999/xlink">
 <defs/>
 <metadata>
  <atv:parameter behavior="optional" defaultvalue="#018E42" desc="On Color" name="on_color" substitute="$on_color$" valuetype="color"/>
  <atv:parameter behavior="optional" defaultvalue="#000000" desc="Off Color" name="off_color" substitute="$off_colo$" valuetype="color"/>
  <atv:parameter behavior="optional" defaultvalue="true" name="flip" valuetype="bool"/>
  <atv:gridconfig enabled="false" gridstyle="lines" height="20" width="20"/>
  <atv:snapconfig enabled="false" height="10" width="10"/>
 </metadata>
 <polyline atv:refpx="16.5" atv:refpy="19.5445" fill="#ffffff" id="B" points="21.5,13.544 11.5,19.545 21.5,25.545 21.5,13.544" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"/>
 <polyline atv:refpx="5.444" atv:refpy="19.544" fill="#ffffff" id="A" points="10.443,19.545 0.443,13.544 0.443,25.545 10.443,19.545" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"/>
 <polyline atv:refpx="11.006" atv:refpy="13.064" fill="none" id="line" points="10.997,16.542 11.007,15.584 11.007,11.578 11.007,9.578" stroke="#000000" stroke-width="1"/>
 <circle atv:refpx="10" atv:refpy="5.5" cx="11" cy="7.5" fill="#ffffff" id="circle_2" r="7" stroke="#000000" stroke-width="1"/>
 <polyline atv:refpx="11.002" atv:refpy="7.474" fill="none" id="text" points="7.5,10.97 7.5,3.97 11,9.22 14.5,3.97 14.5,10.97" stroke="#000000" stroke-linecap="butt" stroke-linejoin="round" stroke-width="1"/>
 <polyline atv:refpx="10.9995" atv:refpy="25.095" fill="#ffffff" id="C" points="17,30.095 10.999,20.095 4.999,30.095 17,30.095" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"/>
 <circle atv:refpx="11" atv:refpy="19.417" cx="11" cy="19.417" fill="#ffffff" id="circle" r="2.828" stroke="#000000" stroke-width="1"/>
 <script atv:desc="" atv:name="" type="text/ecmascript"><![CDATA[var on_color = webMI.query["on_color"];
var off_color = webMI.query["off_color"];
const flip = webMI.query["flip"];

webMI.data.subscribe(webMI.query["base"], function(e) {
	if(e.value){
		webMI.gfx.setFill("A", on_color);
		webMI.gfx.setFill("B", on_color);
		webMI.gfx.setFill("C", off_color);
		webMI.gfx.setFill("circle", on_color);
		
	}else{
		if(flip === "true"){
			webMI.gfx.setFill("A", off_color);
			webMI.gfx.setFill("B", on_color);
			webMI.gfx.setFill("C", on_color);
			webMI.gfx.setFill("circle", on_color);
			
		}else if(flip === "false"){
			webMI.gfx.setFill("A", on_color);
			webMI.gfx.setFill("B", off_color);
			webMI.gfx.setFill("C", on_color);
			webMI.gfx.setFill("circle", on_color);
		
		}
	}
});

]]></script>
</svg>
