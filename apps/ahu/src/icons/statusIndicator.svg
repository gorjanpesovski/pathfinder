L57.789,49.811L53.633,45.656C52.835,44.859 52.835,43.569 53.633,42.781C54.43,41.991 55.719,41.984 56.508,42.781L57.78,44.054L57.789,41.5C57.789,40 59.002,38.786 60.502,38.786",
