    },
    "ON/OFF": {
        d: "M352 64C352 46.3 337.7 32 320 32C302.3 32 288 46.3 288 64L288 320C288 337.7 302.3 352 320 352C337.7 352 352 337.7 352 320L352 64zM210.3 162.4C224.8 152.3 228.3 132.3 218.2 117.8C208.1 103.3 188.1 99.8 173.6 109.9C107.4 156.1 64 233 64 320C64 461.4 178.6 576 320 576C461.4 576 576 461.4 576 320C576 233 532.6 156.1 466.3 109.9C451.8 99.8 431.9 103.3 421.7 117.8C411.5 132.3 415.1 152.2 429.6 162.4C479.4 197.2 511.9 254.8 511.9 320C511.9 426 425.9 512 319.9 512C213.9 512 128 426 128 320C128 254.8 160.5 197.1 210.3 162.4z"
    },
    "Lights": {
        d: "M420.9 448C428.2 425.7 442.8 405.5 459.3 388.1C492 353.7 512 307.2 512 256C512 150 426 64 320 64C214 64 128 150 128 256C128 307.2 148 353.7 180.7 388.1C197.2 405.5 211.9 425.7 219.1 448L420.8 448zM416 496L224 496L224 512C224 556.2 259.8 592 304 592L336 592C380.2 592 416 556.2 416 512L416 496zM312 176C272.2 176 240 208.2 240 248C240 261.3 229.3 272 216 272C202.7 272 192 261.3 192 248C192 181.7 245.7 128 312 128C325.3 128 336 138.7 336 152C336 165.3 325.3 176 312 176z"
    }
};

// Checked in this order, first match wins.
const states = [{
        value: true_value,
        color: trueColor,
        icon: true_icon
    },
    {
        value: false_value,
        color: falseColor,
        icon: false_icon
    },
    {
        value: state3_value,
        color: state3_color,
        icon: state3_icon
    },
    {
        value: state4_value,
        color: state4_color,
        icon: state4_icon
    }
];

// Returns true when a Boolean, Integer or String node value represents "on".
function isTrue(value) {
    return value === true || value === 1 || value === "1" || value === "true";
}

// Returns true when a Boolean, Integer or String node value represents "off".
// Kept separate from isTrue() rather than using its negation, so a custom
// state value like "Medium" is not accidentally caught by the false state.
function isFalse(value) {
    return value === false || value === 0 || value === "0" || value === "false";
}

// Matches a node value against one state's configured match value. "true" and
// "false" are matched loosely so Boolean, Integer and String nodes all work.
// Any other match value is compared as plain text, for custom states such as
// "Heating" or "Cooling".
function valuesMatch(node_value, match_value) {
    if (match_value === "true") return isTrue(node_value);
    if (match_value === "false") return isFalse(node_value);
    return String(node_value) === match_value;
}

// Shows the coloured led and, if one is configured, the matching icon on top of it.
// The icon path "d" (and fill-rule) are pulled from iconPaths and written onto
// the single "icon_path" element instead of toggling between hardcoded icons.
function showState(color, icon) {
    webMI.gfx.setFill("led", color);

    const iconData = iconPaths[icon];
    if (iconData) {
        document.getElementById("icon_path").setAttribute("d", iconData.d);
        document.getElementById("icon_path").setAttribute("fill-rule", iconData.rule === "evenodd" ? "evenodd" : "nonzero");
        webMI.gfx.setVisible("icon", true);
    } else {
        webMI.gfx.setVisible("icon", false);
    }
}

webMI.gfx.setFill("icon_path", icon_color);

webMI.data.subscribe(webMI.query["base"], function(e) {
    if (e.value === null || e.value === undefined) {
        showState(undefinedColor, undefined_icon);
        return;
    }

    for (const state of states) {
        if (!state.value) continue;
        if (valuesMatch(e.value, state.value)) {
            showState(state.color, state.icon);
            return;
        }
    }

    showState(undefinedColor, undefined_icon);
});]]></script>
